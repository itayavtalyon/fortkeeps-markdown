# SwiftLint — run with `--strict` (see Justfile) so every violation fails CI.
# Formatting rules that SwiftFormat owns are deliberately not duplicated here.

included:
  - Package.swift
  - Sources
  - Tests

# Opt-in rules that catch real defects / enforce a consistent, safe style.
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  # multiline_arguments / multiline_parameters intentionally omitted: they are
  # formatting concerns that SwiftFormat owns, and conflict with its wrapping.
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unavailable_function
  - unowned_variable_capture
  - yoda_condition

# Analyzer-only rules (run via `swiftlint analyze`, see Justfile `analyze`).
analyzer_rules:
  - unused_declaration
  - unused_import

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 2
  excluded: [id, db, x, y, to, of]

# Fresh repo: no historical debt to grandfather in.
warning_threshold: 1
